# Netlify: static version of the site. Online requests arrive in
# Netlify → Forms ("appointment-request" and "enquiry").
[build]
  command = "node scripts/build-static.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  SITE_URL = "https://www.dranaghadeshpande.com"

# Old server-style links keep working
[[redirects]]
  from = "/book-appointment"
  to = "/book-appointment/srv"
  status = 302
  force = false
  query = { clinic = "srv" }
[[redirects]]
  from = "/book-appointment"
  to = "/book-appointment/justcare"
  status = 302
  query = { clinic = "justcare" }
[[redirects]]
  from = "/mr/book-appointment"
  to = "/mr/book-appointment/srv"
  status = 302
  query = { clinic = "srv" }
[[redirects]]
  from = "/mr/book-appointment"
  to = "/mr/book-appointment/justcare"
  status = 302
  query = { clinic = "justcare" }
[[redirects]]
  from = "/admin/*"
  to = "/"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://plausible.io; style-src 'self'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self' https://plausible.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Send netlify.app and the bare domain to the main address
[[redirects]]
  from = "https://dranaghadeshpande.com/*"
  to = "https://www.dranaghadeshpande.com/:splat"
  status = 301
  force = true
